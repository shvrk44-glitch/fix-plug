<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="FIX-PLUG Brand Icon">
  <!-- Dark Background -->
  <rect width="200" height="200" rx="36" fill="#0A0A0A"/>

  <!-- Center Group -->
  <g id="tools-emblem">
    <!-- 1. Diagonal Wrench (Slate #8192A2, tilting top-left) -->
    <g transform="translate(100, 100) rotate(-45)">
      <!-- Wrench Handle -->
      <rect x="-9" y="-62" width="18" height="124" rx="9" fill="#8192A2"/>
      <!-- Wrench Jaw Head -->
      <path d="M -9 -46 
               C -24 -46 -28 -72 -10 -84 
               C 8 -92 28 -76 26 -58 
               L 10 -58 
               L 10 -72 
               L -6 -68 
               L -6 -46 Z" 
            fill="#8192A2"/>
    </g>

    <!-- 2. Diagonal Mallet / Hammer (Copper #B6855A, tilting top-right) -->
    <g transform="translate(100, 100) rotate(45)">
      <!-- Mallet Handle -->
      <rect x="-8" y="-60" width="16" height="122" rx="8" fill="#B6855A"/>
      <!-- Mallet Head -->
      <rect x="-24" y="-76" width="48" height="24" rx="6" fill="#B6855A" stroke="#0A0A0A" stroke-width="1.5"/>
    </g>

    <!-- 3. Vertical Broom (Cream #F3EBE0 with near-black outlines) in Foreground -->
    <g id="broom" transform="translate(100, 0)">
      <!-- Broom Handle -->
      <rect x="-4.5" y="30" width="9" height="92" rx="4.5" fill="#F3EBE0" stroke="#0A0A0A" stroke-width="2"/>
      
      <!-- Broom Cap / Collar -->
      <rect x="-13" y="118" width="26" height="12" rx="3" fill="#F3EBE0" stroke="#0A0A0A" stroke-width="2.5"/>

      <!-- Broom Bristles Skirt -->
      <path d="M -11 130 
               L 11 130 
               L 23 168 
               L -23 168 Z" 
            fill="#F3EBE0" stroke="#0A0A0A" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- Bristle Lines -->
      <line x1="-9" y1="131" x2="-14" y2="167" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="0" y1="131" x2="0" y2="167" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="9" y1="131" x2="14" y2="167" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
